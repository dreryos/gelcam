[project]
name = "gelcam"
version = "0.1.0"
description = "Tethering a zpracování snímků gelů pro Canon EOS 100D na Windows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "platformdirs>=4.0",
    "pyside6>=6.6",
]

[project.optional-dependencies]
processing = [
    "rawpy>=0.19",
    "tifffile>=2024.1",
    "opencv-python-headless>=4.9",
]

[project.scripts]
gelcam = "gelcam.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gelcam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
